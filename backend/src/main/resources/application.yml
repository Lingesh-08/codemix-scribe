server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scribe}
    username: ${DB_USER:scribe}
    password: ${DB_PASSWORD:scribe}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: none        # Flyway owns the schema
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  jwt-secret: ${JWT_SECRET:scribe-dev-jwt-secret-change-me-0123456789abcdef}
  jwt-expiry-hours: ${JWT_EXPIRY_HOURS:24}
  service-secret: ${SERVICE_SECRET:scribe-dev-service-secret}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8001}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
